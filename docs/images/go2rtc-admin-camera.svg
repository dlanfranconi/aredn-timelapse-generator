<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">Admin camera configuration with snapshot, RTSP, and PTZ fields</title>
  <desc id="desc">Illustrative browser screenshot showing Fenetre admin camera setup fields for snapshot URL, credentials, RTSP URL, PTZ alignment stream, and PTZ capability settings.</desc>
  <rect width="1120" height="720" fill="#eef1f5"/>
  <rect x="40" y="40" width="1040" height="640" rx="8" fill="#ffffff" stroke="#c8ced8"/>
  <rect x="40" y="40" width="1040" height="44" rx="8" fill="#253041"/>
  <circle cx="66" cy="62" r="6" fill="#ff5f57"/>
  <circle cx="86" cy="62" r="6" fill="#ffbd2e"/>
  <circle cx="106" cy="62" r="6" fill="#28c840"/>
  <text x="136" y="68" font-family="Arial, sans-serif" font-size="15" fill="#d7dee9">http://camera-host:8889/</text>
  <text x="80" y="128" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2937">Fenetre Admin</text>
  <text x="80" y="166" font-family="Arial, sans-serif" font-size="16" fill="#5b6472">Add or edit camera</text>
  <rect x="80" y="198" width="960" height="390" rx="6" fill="#f8fafc" stroke="#d7dde7"/>
  <text x="112" y="238" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#263143">Camera name</text>
  <rect x="112" y="252" width="410" height="40" rx="5" fill="#ffffff" stroke="#b8c0cc"/>
  <text x="128" y="277" font-family="Arial, sans-serif" font-size="14" fill="#374151">Ridge-PTZ</text>
  <text x="570" y="238" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#263143">Capture source</text>
  <rect x="570" y="252" width="220" height="40" rx="5" fill="#ffffff" stroke="#b8c0cc"/>
  <text x="586" y="277" font-family="Arial, sans-serif" font-size="14" fill="#374151">HTTP snapshot</text>
  <path d="M764 267l7 8 7-8" fill="none" stroke="#374151" stroke-width="2"/>
  <text x="112" y="326" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#263143">Snapshot URL</text>
  <rect x="112" y="340" width="680" height="40" rx="5" fill="#ffffff" stroke="#b8c0cc"/>
  <text x="128" y="365" font-family="Arial, sans-serif" font-size="14" fill="#374151">http://ridge-camera.local/snapshot.jpg</text>
  <text x="112" y="414" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#263143">Snapshot username</text>
  <rect x="112" y="428" width="250" height="40" rx="5" fill="#ffffff" stroke="#b8c0cc"/>
  <text x="128" y="453" font-family="Arial, sans-serif" font-size="14" fill="#374151">admin</text>
  <text x="394" y="414" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#263143">Snapshot password</text>
  <rect x="394" y="428" width="250" height="40" rx="5" fill="#ffffff" stroke="#b8c0cc"/>
  <text x="410" y="453" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">••••••••••</text>
  <text x="676" y="414" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#263143">Auth type</text>
  <rect x="676" y="428" width="180" height="40" rx="5" fill="#ffffff" stroke="#b8c0cc"/>
  <text x="692" y="453" font-family="Arial, sans-serif" font-size="14" fill="#374151">Auto</text>
  <text x="112" y="502" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#263143">RTSP URL for snapshot fallback or restreaming</text>
  <rect x="112" y="516" width="680" height="40" rx="5" fill="#ffffff" stroke="#b8c0cc"/>
  <text x="128" y="541" font-family="Arial, sans-serif" font-size="14" fill="#374151">rtsp://user:pass@ridge-camera.local:554/stream1</text>
  <text x="112" y="608" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#263143">PTZ alignment RTSP URL</text>
  <rect x="112" y="622" width="680" height="40" rx="5" fill="#ffffff" stroke="#b8c0cc"/>
  <text x="128" y="647" font-family="Arial, sans-serif" font-size="14" fill="#374151">rtsp://user:pass@ridge-camera.local:554/stream2</text>
  <rect x="834" y="516" width="160" height="40" rx="5" fill="#1664d9"/>
  <text x="876" y="541" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Test RTSP</text>
  <rect x="834" y="622" width="160" height="40" rx="5" fill="#1664d9"/>
  <text x="876" y="647" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Save</text>
</svg>
