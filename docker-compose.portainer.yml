services:
  aredn-timelapse-generator:
    build: .
    container_name: aredn-timelapse-generator
    restart: unless-stopped

    ports:
      # Public/static camera website
      - "8888:8888"
      # Admin/configuration GUI
      - "8889:8889"
      # go2rtc web/API for PTZ live alignment
      - "1984:1984"
      # go2rtc RTSP restreaming
      - "8554:8554"
      # go2rtc WebRTC
      - "8555:8555"
      - "8555:8555/udp"

    environment:
      TZ: America/Los_Angeles
      FENETRE_PID_FILE: /tmp/fenetre.pid
      # auto: start bundled go2rtc only when global.go2rtc.enabled is true.
      # Use "off" to disable it or "on" to require it at startup.
      # Alignment live views default to WebRTC and unload after
      # global.go2rtc.live_view_idle_timeout_s seconds of PTZ inactivity.
      # If WebRTC fails while MSE/HLS works, set
      # global.go2rtc.webrtc_candidates to HOST:8555 in config.yaml.
      FENETRE_GO2RTC: auto

    volumes:
      # Persistent runtime config on the host. The admin UI writes changes here.
      - /srv/fenetre/config.yaml:/srv/fenetre/config.yaml

      # Persistent generated public UI, photos, videos, and metadata.
      - /srv/fenetre/data:/srv/fenetre/data

      # Persistent logs.
      - /srv/fenetre/logs:/srv/fenetre/logs

    # Optional: enable this only if you want Intel VAAPI/QSV hardware encoding
    # and the host has /dev/dri available.
    # devices:
    #   - /dev/dri:/dev/dri
