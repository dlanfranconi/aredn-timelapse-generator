<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>Camera List</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="list.css?v=20260824-privacy-pin-jitter">
</head>
<body>
    <div id="main-container">
        <div id="map-panel">
            <div id="map"></div>
        </div>
        <div id="list-panel">
            <style>
                #controls {
                    display: flex;
                    align-items: center;
                    gap: 10px;
                }
            </style>
            <div id="list-header">
                <h1>Camera List</h1>
                <div id="controls">
                    <a id="main-website-link" href="https://fenetre.cam" target="_blank" rel="noopener noreferrer" title="Fenetre.cam Project Website">
                        <svg class="icon icon-world-map" viewBox="0 0 24 24" aria-hidden="true">
                            <rect class="map-water" x="3" y="5" width="18" height="14" rx="2"/>
                            <path class="map-grid" d="M4 9h16M4 15h16M9 5.5c-.8 3.8-.8 9.2 0 13M15 5.5c.8 3.8.8 9.2 0 13"/>
                            <path class="map-land" d="M6.2 8.1l1.5-.8 2 .4.7 1.2-1 1.1.4 1.2-1.2.7-1.7-.8-.5-1.3-1.1-.4z"/>
                            <path class="map-land" d="M12.5 7.6l2.1-.7 2.3.5 1.2 1.3-.7 1.4-1.8.1-.5 1.3-1.4-.2-.4-1.6-1.5-.6z"/>
                            <path class="map-land" d="M10.4 13.1l1.8-.4 1.4 1 .2 1.8-1.3 1.3-1.8-.7-.8-1.6z"/>
                            <path class="map-land" d="M16.7 14.4l1.2-.5 1 .8-.2 1.4-1.3.5-.9-.8z"/>
                        </svg>
                    </a>
                    <a id="github-link" href="https://github.com/dlanfranconi/aredn-timelapse-generator" target="_blank" rel="noopener noreferrer" title="GitHub Repository">
                        <svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
                        </svg>
                    </a>
                    <a id="launch-dashboard-link" href="/launches.html" title="Launch Dashboard" hidden>
                        <svg class="icon icon-launch" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M13.3 3.3c2.8.4 5.1 2.7 5.5 5.5l-4.5 4.5-3.2-.4-.4-3.2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                            <path d="M9.8 10.4l-3.4.8-2.1 3.1 4.9-.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                            <path d="M13.6 14.2l-.8 4.9 3.1-2.1.8-3.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                            <path d="M7.5 16.5l-2.6 2.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                    </a>
                    <button id="map-toggle" type="button" aria-label="Toggle map visibility">
                        <svg class="icon icon-map" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M3 7.5l6-2.2 6 2.2 6-2.2v12l-6 2.2-6-2.2-6 2.2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                            <path d="M9 5.3v12" fill="none" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M15 7.5v12" fill="none" stroke="currentColor" stroke-width="1.5"/>
                        </svg>
                        <svg class="icon icon-list" viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="5" y="6" width="14" height="2" rx="1" fill="currentColor"/>
                            <rect x="5" y="11" width="14" height="2" rx="1" fill="currentColor"/>
                            <rect x="5" y="16" width="14" height="2" rx="1" fill="currentColor"/>
                        </svg>
                    </button>
                    <button id="theme-toggle" type="button" aria-label="Toggle theme">
                        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
                            <line x1="12" y1="3" x2="12" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            <line x1="12" y1="18" x2="12" y2="21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            <line x1="4.22" y1="4.22" x2="6.34" y2="6.34" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            <line x1="17.66" y1="17.66" x2="19.78" y2="19.78" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            <line x1="3" y1="12" x2="6" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            <line x1="18" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            <line x1="4.22" y1="19.78" x2="6.34" y2="17.66" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            <line x1="17.66" y1="6.34" x2="19.78" y2="4.22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M15.5 3.5A8.5 8.5 0 1 0 20.5 17a6.5 6.5 0 0 1-5-13.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <div class="account-menu-root">
                        <button id="login-toggle" type="button" aria-haspopup="menu" aria-expanded="false">Login</button>
                        <div id="account-menu" class="account-menu-panel" role="menu" hidden>
                            <div id="account-menu-role" class="account-menu-role"></div>
                            <button id="change-password-toggle" type="button" role="menuitem">Change Password</button>
                            <button id="logout-submit" type="button" role="menuitem">Logout</button>
                        </div>
                    </div>
                </div>
            </div>
            <div id="login-backdrop" class="modal" hidden>
                <div id="login-panel" role="dialog" aria-modal="true" aria-labelledby="login-panel-title">
                    <h2 id="login-panel-title">Sign in</h2>
                    <div class="login-field">
                        <label for="login-username">Username</label>
                        <input id="login-username" type="text" autocomplete="off" autocapitalize="none" spellcheck="false">
                    </div>
                    <div class="login-field">
                        <label for="login-password">Password</label>
                        <input id="login-password" type="password" autocomplete="new-password" autocapitalize="none" spellcheck="false">
                    </div>
                    <span id="login-status"></span>
                    <div class="login-actions">
                        <button id="login-close" type="button" class="login-btn-secondary">Cancel</button>
                        <button id="login-submit" type="button" class="login-btn-primary">Sign in</button>
                    </div>
                </div>
            </div>
            <div id="password-panel" hidden>
                <input id="current-password" type="password" autocomplete="current-password" placeholder="Current password">
                <input id="new-password" type="password" autocomplete="new-password" placeholder="New password">
                <input id="confirm-password" type="password" autocomplete="new-password" placeholder="Confirm password">
                <button id="password-submit" type="button">Save Password</button>
                <button id="password-cancel" type="button">Cancel</button>
                <span id="password-status"></span>
            </div>
            <section id="private-landing" class="private-landing" hidden>
                <h2 id="private-landing-name">Fenetre</h2>
                <p>Log in to view cameras.</p>
                <button id="private-login-button" type="button">Login</button>
            </section>
            <ul id="camera-list"></ul>
            <footer id="app-footer" class="app-footer"></footer>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
    <script src="list.js?v=20260903-ios-timelapse-archive-same-tab"></script>
</body>
</html>
