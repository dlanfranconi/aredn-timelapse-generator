# Current AREDN/IP-camera deployment template.
# Copy this to /srv/fenetre/config.yaml and edit hostnames, credentials, and
# camera names from the admin dashboard or directly in YAML.

global:
  work_dir: /srv/fenetre/data
  log_dir: /srv/fenetre/logs
  timezone: America/Los_Angeles
  logging_level: INFO
  deployment_name: Fenetre Skywatch

  ui:
    landing_page: list
    # true: anonymous visitors can view public cameras on port 8888.
    # false: port 8888 shows a login landing page before camera data is served.
    public_site: true
    show_map_by_default: false
    show_main_website_icon: true
    show_github_icon: true
    main_website_url: https://fenetre.cam
    map_privacy_radius_m: 0
    map_privacy_jitter_m: 0

  go2rtc:
    enabled: true
    # Leave blank to let local/offline browsers use the current host on port 1984.
    base_url: ""
    # Optional exact browser-host overrides, useful for Cloudflare Tunnel hostnames.
    base_urls:
      aredncameras.aredn805.net: https://streams.aredncameras.aredn805.net
    # stream.html is the default compatibility player. Fenetre keeps generated
    # player URLs video-only and muted by default.
    player_url_template: "{base_url}/stream.html?src={stream}&media=video&muted=1"
    preview_url_template: "{base_url}/stream.html?src={stream}&media=video&muted=1"
    stream_name_prefix: fenetre_
    api_listen: ":1984"
    rtsp_listen: ":8554"
    webrtc_listen: ":8555"
    webrtc_candidates: []
    live_view_idle_timeout_s: 60

  storage_management:
    enabled: true
    dry_run: false
    check_interval_s: 300
    work_dir_max_size_GB: 50
    camera_max_size_GB: 5
    prune_snapshots_first: true

  # Disabled by default so non-launch deployments look and behave like the
  # normal camera/timelapse server.
  launch_workflow:
    enabled: false
    dry_run: true
    schedule_url: https://ll.thespacedevs.com/2.3.0/launches/upcoming/?format=json&limit=100&ordering=net
    schedule_timeout_s: 10
    refresh_interval_s: 300
    lookahead_hours: 168
    default_pre_seconds: 60
    default_post_seconds: 900
    state_file: /srv/fenetre/data/launch_workflow_state.json
    plans:
      vandenberg-spacex:
        enabled: true
        match:
          providers:
            - SpaceX
          locations:
            - Vandenberg
          pads: []
          names: []
          statuses: []
          keywords: []
        pre_seconds: 60
        post_seconds: 900
        cameras:
          Ridge-PTZ:
            pause_tour: true
            resume_tour: true
            preset: launch-pad
            image_profile: launch
            record:
              vendor: reolink
              http_port: 80
              channel: 0
              stream_type: main
              manual_record_duration_s: 1200
              download_method: Download
              download_path: /srv/fenetre/data/launches/{launch_id}/{launch_id}-{camera}.mp4
              download_delay_seconds: 60
              skip_when_full_viewers: true

http_server:
  enabled: true
  listen: 0.0.0.0:8888

admin_server:
  enabled: true
  listen: 0.0.0.0:8889

timelapse:
  frequent_timelapse:
    enabled: true
    interval_s: 1200
    framerate: 30
    max_width: 1280
    max_height: 720
    ffmpeg_2pass: false
    output_format: hls
    ffmpeg_options: >-
      -c:v libx264
      -preset veryfast
      -crf 30
      -pix_fmt yuv420p
    file_extension: mp4

  daily_timelapse:
    enabled: true
    framerate: 60
    max_width: 1920
    max_height: 1080
    ffmpeg_2pass: false
    ffmpeg_options: >-
      -c:v libx264
      -preset medium
      -crf 28
      -pix_fmt yuv420p
      -movflags +faststart
    file_extension: mp4

cameras:
  Ridge-PTZ:
    description: Example Reolink-style snapshot + RTSP + ONVIF PTZ camera.
    visibility: public
    public: true

    url: http://192.0.2.50/cgi-bin/api.cgi?cmd=Snap&channel=0&rs=fenetre&user=admin&password=CHANGE_ME
    http_auth:
      username: admin
      password: CHANGE_ME
      type: basic
    cache_bust: false

    # Main/full stream and optional low-resolution PTZ alignment stream.
    go2rtc_enabled: true
    rtsp_url: rtsp://admin:CHANGE_ME@192.0.2.50:554/main
    ptz_rtsp_url: rtsp://admin:CHANGE_ME@192.0.2.50:554/sub

    ptz:
      enabled: true
      host: 192.0.2.50
      port: 80
      username: admin
      password: CHANGE_ME
      allow_presets: true
      allow_manual_control: true
      access_level: presets
      capabilities:
        pan: true
        tilt: true
        zoom: true
      tour:
        enabled: true
        auto_resume_s: 1800
      presets:
        - id: launch-pad
          token: "1"
          name: Launch Pad
        - id: home
          token: "2"
          name: Home

    image_profiles:
      enabled: false
      vendor: reolink
      host: 192.0.2.50
      http_port: 80
      channel: 0
      username: admin
      password: CHANGE_ME
      profiles:
        launch:
          actions:
            - name: launch-exposure
              method: POST
              url: http://{host}/api/launch-image
              json:
                mode: launch

    timeout_s: 15
    capture_failure_interval_s: 180
    gather_metrics: true
    mozjpeg_optimize: true
    snap_interval_s: 60
    activity_interval_s: 10
    ssim_area: 0,0,1,0.75
    ssim_setpoint: 0.88
    sky_area: 0,0,1,0.35
    lat: 35.2828
    lon: -120.6596
    map_privacy_radius_m: 1200
    timelapse_enabled: true
    sunrise_sunset:
      enabled: true
      interval_s: 10
      sunrise_offset_start_minutes: 45
      sunrise_offset_end_minutes: 45
      sunset_offset_start_minutes: 45
      sunset_offset_end_minutes: 45
    postprocessing:
      - type: timestamp
        enabled: true
        position: bottom_right
        size: 24
        color: white
        format: "%Y-%m-%d %H:%M:%S %Z"
      - type: sun_path
        enabled: true
        major_bar_width: 2
        minor_bar_width: 1
        overlay_bar_width: 4
        overlay_width: 800
        padding: 20
        position: top_center

  RTSP-Only:
    description: Example camera where still captures come from RTSP.
    visibility: authenticated
    public: false
    go2rtc_enabled: true
    rtsp_url: rtsp://admin:CHANGE_ME@192.0.2.51:554/stream1
    local_command: >-
      ffmpeg -hide_banner -loglevel error -rtsp_transport tcp
      -allowed_media_types video
      -i rtsp://admin:CHANGE_ME@192.0.2.51:554/stream1
      -an -map 0:v:0 -frames:v 1 -f image2pipe -vcodec mjpeg -
    timeout_s: 20
    capture_failure_interval_s: 180
    snap_interval_s: 60
    activity_interval_s: 10
    ssim_area: 0,0,1,0.75
    ssim_setpoint: 0.88
    lat: 35.2828
    lon: -120.6596
    timelapse_enabled: true
    postprocessing:
      - type: timestamp
        enabled: true
        position: bottom_right
        size: 24
        color: white
        format: "%Y-%m-%d %H:%M:%S %Z"

  Hidden-Maintenance-Camera:
    description: Hidden snapshot camera kept in admin/config only.
    disabled: true
    visibility: hidden
    public: false
    url: http://192.0.2.52/images/snapshot.jpg
    http_auth:
      username: admin
      password: CHANGE_ME
      type: basic
    cache_bust: false
    go2rtc_enabled: false
    timeout_s: 15
    snap_interval_s: 300
    timelapse_enabled: false

# Omit users on first setup to let Fenetre bootstrap admin/admin as a
# superadmin. After the first login, change that password from the account menu
# or Manage Users.
