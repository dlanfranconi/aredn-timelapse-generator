# Local smoke-test config. This uses ffmpeg's generated test pattern instead of
# a network camera and keeps all runtime output under /tmp.

global:
  timezone: UTC
  work_dir: /tmp/fenetre-smaller/data
  log_dir: /tmp/fenetre-smaller/logs
  deployment_name: Fenetre Local Test
  ui:
    landing_page: list
    public_site: true
    show_map_by_default: false
    map_privacy_radius_m: 0
    map_privacy_jitter_m: 0
  go2rtc:
    enabled: false
  storage_management:
    enabled: false
  launch_workflow:
    enabled: false
    dry_run: true

http_server:
  enabled: false

admin_server:
  enabled: false

timelapse:
  frequent_timelapse:
    enabled: false
  daily_timelapse:
    enabled: false

cameras:
  testsrc:
    description: Local ffmpeg test pattern.
    local_command: >-
      ffmpeg -hide_banner -loglevel error -f lavfi
      -i testsrc=size=640x480:rate=1
      -frames:v 1 -f image2pipe -vcodec mjpeg -
    visibility: public
    public: true
    lat: 37.6
    lon: -122.4
    timeout_s: 20
    snap_interval_s: 5
    cache_bust: false
    go2rtc_enabled: false
    ssim_area: 0,0,640,120
    ssim_setpoint: 0.9
    postprocessing:
      - type: resize
        height: 240
      - type: timestamp
        enabled: true
        size: 16
        color: white
        background_color: "(40, 40, 40)"
      - type: gather_metrics
        enabled: true
